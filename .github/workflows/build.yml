name: Build Linux OEM 6.0 KCOV

on:
  push:
    branches: [compile-kernel6]
  workflow_dispatch:

permissions:
  contents: write   # wajib untuk membuat release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils

      - name: Download Linux OEM 6.0 source
        run: |
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0.orig.tar.gz
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0-1021.21.diff.gz
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0-1021.21.dsc

      - name: Extract source
        run: |
          dpkg-source -x linux-oem-6.0_6.0.0-1021.21.dsc

      - name: Configure kernel
        run: |
          set -o pipefail
          cd linux-oem-6.0-6.0.0
          cp ../linux-config/.config .config
          {
            echo "=== Original config ==="
            grep -E 'CONFIG_(KCOV|KCOV_ENABLE_COMPARISONS|KCOV_INSTRUMENT_ALL|FUNCTION_TRACER|FUNCTION_GRAPH_TRACER|DYNAMIC_FTRACE|BPF|BPF_SYSCALL|BPF_JIT|DEBUG_INFO|FRAME_POINTER|LOCALVERSION)=' .config

            scripts/config --enable CONFIG_KCOV
            scripts/config --enable CONFIG_KCOV_ENABLE_COMPARISONS
            scripts/config --set-str CONFIG_LOCALVERSION "-kcov"

            make olddefconfig

            echo "=== Final config ==="
            grep -E 'CONFIG_(KCOV|KCOV_ENABLE_COMPARISONS|KCOV_INSTRUMENT_ALL|FUNCTION_TRACER|FUNCTION_GRAPH_TRACER|DYNAMIC_FTRACE|BPF|BPF_SYSCALL|BPF_JIT|DEBUG_INFO|FRAME_POINTER|LOCALVERSION)=' .config
          } 2>&1 | tee ../mylog.txt

      - name: Prepare and build kernel packages
        run: |
          set -o pipefail

          cd linux-oem-6.0-6.0.0

          {
            echo "========================================"
            echo " Linux OEM 6.0 KCOV BUILD"
            echo "========================================"

            echo
            echo "=== Prepare ==="
            make prepare

            echo
            echo "=== Kernel release ==="
            make -s kernelrelease

            echo
            echo "=== Build Debian packages ==="
            make -j$(nproc) bindeb-pkg

          } 2>&1 | tee -a ../mylog.txt

      - name: Show generated packages
        run: |
          echo "=== Generated .deb packages ==="
          ls -lh ./*.deb 2>/dev/null || true
          ls -lh linux-oem-6.0-6.0.0/*.deb 2>/dev/null || true

      - name: Collect bzImage and vmlinux
        run: |
          cd linux-oem-6.0-6.0.0
          mkdir -p ../release

          cp arch/x86/boot/bzImage ../release/bzImage
          cp System.map ../release/System.map
          cp .config ../release/kernel.config

          cp vmlinux ../release/vmlinux



      - name: Collect artifacts
        run: |
          mkdir -p output

          cp mylog.txt output/

          cp -r release output/ 2>/dev/null || true

          tar czvf linux-oem-6-kcov.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-oem-6-kcov
          path: linux-oem-6-kcov.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="kcov-6.0.9-run${{ github.run_number }}"
          gh release create "$TAG" \
            linux-oem-6-kcov.tar.gz \
            --target "${{ github.sha }}" \
            --title "Linux 6.0.9 KCOV (run ${{ github.run_number }})" \
            --notes "bzImage + vmlinux dengan KCOV. Commit: ${{ github.sha }}" \
            --prerelease

