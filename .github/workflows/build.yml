name: Build Program container

on:
  push:
    branches: [codeql-cont-aircrack]
  pull_request:
    branches: [codeql-cont-aircrack]


permissions:
  contents: write   # wajib untuk membuat release

env:
  MAGMA_TAG: v1.2.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download codeql
        run: |
          wget https://github.com/github/codeql-cli-binaries/releases/download/v2.23.9/codeql-linux64.zip
          unzip codeql-linux64.zip


      - name: Dump database aircrack-ng
        run: |
          mkdir -p out
          git clone https://github.com/aircrack-ng/aircrack-ng.git

          # docker build
          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -euxc '
            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential autoconf automake libtool pkg-config \
              libssl-dev libnl-3-dev libnl-genl-3-dev libpcap-dev libsqlite3-dev \
              libpcre2-dev zlib1g-dev ethtool

            export PATH="`pwd`/codeql:$PATH"

            cd aircrack-ng
            autoreconf -i
            ./configure
            make clean

            echo "=========== start dump database ================"
            codeql database create ../aircrack-db \
              --language=cpp \
              --source-root=. \
              --command="make -j$(nproc)"

            echo "=========== done dump database ================"
            codeql database bundle ../aircrack-db --output=../aircrack-db.zip

            codeql database analyze ../aircrack-db \
              codeql/cpp-queries:codeql-suites/cpp-security-extended.qls \
              --format=sarif-latest --output=../aircrack-results.sarif --threads=0

            # copy result
            cd ..
            cp aircrack-results.sarif out/
            cp -R aircrack-db.zip out/
          '

      - name: Kompres
        run: |
          sudo chown -R $USER out
          tar czvf result.tar.gz \
            -C out .

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aircrack-db
          name: aircrack-db
          files: |
            result.tar.gz




