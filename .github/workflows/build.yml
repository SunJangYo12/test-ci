name: Build Linux 4 KCOV

on:
  push:
    branches: [compile-kernel-linux_4.4.0-142]
  pull_request:
    branches: [compile-kernel-linux_4.4.0-142]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update DEBIAN_FRONTEND=noninteractive
          apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev dwarves rsync git fakeroot dpkg-dev python3 perl kmod cpio


      - name: Download Linux 4
        run: |
          wget https://launchpad.net/ubuntu/+archive/primary/+files/linux-oem_4.13.0-1032.36.dsc
          wget https://launchpad.net/ubuntu/+archive/primary/+files/linux-oem_4.13.0.orig.tar.gz
          wget https://launchpad.net/ubuntu/+archive/primary/+files/linux-oem_4.13.0-1032.36.diff.gz


      - name: Extract source
        run: |
          dpkg-source -x linux-oem_4.13.0-1032.36.dsc

      - name: Configure kernel
        run: |
          set -o pipefail
          cd linux-oem-4.13.0

          cp ../linux-config/.config .config
          {
            echo "=== Original config ==="
            grep -E 'CONFIG_(KCOV|KCOV_ENABLE_COMPARISONS|KCOV_INSTRUMENT_ALL|FUNCTION_TRACER|FUNCTION_GRAPH_TRACER|DYNAMIC_FTRACE|BPF|BPF_SYSCALL|BPF_JIT|DEBUG_INFO|FRAME_POINTER|LOCALVERSION)=' .config

            scripts/config --enable CONFIG_KCOV
            scripts/config --enable CONFIG_KCOV_ENABLE_COMPARISONS
            scripts/config --set-str CONFIG_LOCALVERSION "-kcov"

            make olddefconfig

            echo "=== Final config ==="
            grep -E 'CONFIG_(KCOV|KCOV_ENABLE_COMPARISONS|KCOV_INSTRUMENT_ALL|FUNCTION_TRACER|FUNCTION_GRAPH_TRACER|DYNAMIC_FTRACE|BPF|BPF_SYSCALL|BPF_JIT|DEBUG_INFO|FRAME_POINTER|LOCALVERSION)=' .config
          } 2>&1 | tee ../mylog.txt

      - name: Prepare and build kernel packages
        run: |
          set -o pipefail

          cd linux-oem-4.13.0

          {
            echo "========================================"
            echo " Linux 4 KCOV BUILD"
            echo "========================================"

            echo
            echo "=== Prepare ==="
            make prepare || true

            echo
            echo "=== Kernel release ==="
            make -s kernelrelease || true

            echo
            echo "=== Build Debian packages ==="
            make -j$(nproc) bindeb-pkg || true

          } 2>&1 | tee -a ../mylog.txt

      - name: Collect artifacts
        run: |
          mkdir -p output

          cp mylog.txt output/

          cp ./*.deb output/ 2>/dev/null || true
          cp linux-oem-4.13.0/*.deb output/ 2>/dev/null || true

          echo "=== Artifact contents ==="
          ls -lh output

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
