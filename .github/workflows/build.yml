name: Build Program container

on:
  push:
    branches: [compile-cont-php]
  pull_request:
    branches: [compile-cont-php]


permissions:
  contents: write   # wajib untuk membuat release

env:
  MAGMA_TAG: v1.2.1
  # commit yang sama dengan magma/targets/php/fetch.sh
  PHP_COMMIT: bc39abe8c3c492e29bc5d60ca58442040bbf063b

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch php-src (commit Magma) dan setup.patch Magma
        run: |
          git clone --no-checkout https://github.com/php/php-src.git php-src
          git -C php-src checkout "$PHP_COMMIT"
          git clone --depth 1 --branch "$MAGMA_TAG" https://github.com/HexHive/magma.git magma


      - name: Build kernel di ubuntu:20.04
        run: |
          mkdir -p out

          # docker build
          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -euxc '
            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential bison \
              curl wget afl++ libxml2-dev autoconf patch libonig-dev

            patch -p1 -d php-src < magma/targets/php/patches/setup/setup.patch

            # Cari driver AFL++
            DRV=$(find / -name libAFLDriver.a 2>/dev/null | head -1)
            [ -n "$DRV" ] || { echo "::error::libAFLDriver.a tidak ditemukan"; exit 1; }

            cd php-src
            export AFL_USE_ASAN=1
            export AFL_LLVM_INSTRUMENT="CLASSIC"
            export CC=afl-clang-fast CXX=afl-clang-fast++
            # sama seperti Magma: object-size sanitizer tidak cocok dengan union zend_function
            export EXTRA_CFLAGS="-O1 -g -fno-sanitize=object-size"
            export EXTRA_CXXFLAGS="$EXTRA_CFLAGS"

            # configure
            ./buildconf --force
            LIB_FUZZING_ENGINE="$DRV" ./configure \
              --disable-all --enable-option-checking=fatal \
              --enable-fuzzer --enable-exif --enable-phar --enable-mbstring \
              --without-pcre-jit --disable-phpdbg --disable-cgi --with-pic

            # make
            make -j"$(nproc)"
            ls -l sapi/fuzzer/php-fuzz-* sapi/cli/php

            # copy result
            cd ..
            cp -R php-src out/
          '

      - name: Kompres
        run: |
          sudo chown -R $USER out
          tar czvf result.tar.gz \
            -C out .

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-magma
          name: php-magma
          files: |
            result.tar.gz




