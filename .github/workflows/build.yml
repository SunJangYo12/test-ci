name: codeql-vscode Listener

on:
  push:
    branches: [codeql-vscode]
  workflow_dispatch:

# gh workflow run build.yml --ref listen-nc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install desktop + noVNC + ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 tigervnc-standalone-server novnc websockify dbus-x11 jq netcat-openbsd wget

          wget https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xzf ngrok-v3-stable-linux-amd64.tgz
          sudo sudo mv ngrok /usr/local/bin



      - name: Install VS Code + ekstensi CodeQL
        run: |
          wget -qO code.deb "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"
          sudo apt-get install -y ./code.deb
          code --install-extension GitHub.vscode-codeql

      - name: Install CodeQL CLI
        run: |
          mkdir -p $HOME/codeql-home && cd $HOME/codeql-home
          gh release download --repo github/codeql-action --pattern 'codeql-bundle-linux64.tar.zst' \
            || true
          # alternatif: gh release download --repo github/codeql-cli-binaries --pattern codeql-linux64.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: (Opsional) Buat database CodeQL
        run: |
          # contoh: ~/codeql-home/codeql/codeql database create $HOME/db \
          #   --language=cpp --command="make -j4" --source-root=.
          echo "skip"

      - name: Start VNC + noVNC
        run: |
          mkdir -p ~/.vnc
          echo "${{ secrets.VNC_PASSWORD }}" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1600x900 -xstartup /usr/bin/startxfce4
          websockify -D --web=/usr/share/novnc 6080 localhost:5901
          DISPLAY=:1 nohup code --no-sandbox --disable-gpu "$GITHUB_WORKSPACE" &

      - name: Tunnel ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          CHAT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "7797309176"
        run: |

          nohup ngrok tcp 5901 --log=stdout > tunnel.log 2>&1 &

          # tunggu sampai ngrok siap (maks ~60 detik)
          URL=""
          for i in $(seq 1 30); do
            URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            HOSTPORT="${URL#tcp://}"
            MSG="[VNC] tiggervnc: $HOSTPORT"
          else
            MSG="GAGAL vnc url"
            tail -n 20 tunnel.log
          fi
          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null


      - name: Run nc listener
        run: |
          # listener di port 20022 (sebelumnya step ini hanya sleep)
          timeout 18000 nc -lvk -p 20022 || true # 5jam
