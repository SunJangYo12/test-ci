name: Build Linux 4 KCOV

on:
  push:
    branches:
      - compile-kernel-linux_4.4.0-142
  pull_request:
    branches:
      - compile-kernel-linux_4.4.0-142

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:16.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves rsync git fakeroot dpkg-dev \
            python3 perl kmod cpio wget ca-certificates

      - name: Download Linux source
        run: |
          wget -O linux-oem_4.13.0-1032.36.dsc \
            https://launchpad.net/ubuntu/+archive/primary/+files/linux-oem_4.13.0-1032.36.dsc
          wget -O linux-oem_4.13.0.orig.tar.gz \
            https://launchpad.net/ubuntu/+archive/primary/+files/linux-oem_4.13.0.orig.tar.gz
          wget -O linux-oem_4.13.0-1032.36.diff.gz \
            https://launchpad.net/ubuntu/+archive/primary/+files/linux-oem_4.13.0-1032.36.diff.gz

      - name: Extract source
        run: |
          dpkg-source -x linux-oem_4.13.0-1032.36.dsc

      - name: Configure kernel
        run: |
          set -e
          git clone https://github.com/sunjangyo12/test-ci
          cd linux-oem-4.13.0

          {
            echo "=== Environment ==="
            pwd
            ls -la ..
            cat /etc/os-release
          } 2>&1 | tee -a "$HOME/mylog.txt"

          cp ../test-ci/linux-config/.config .config

          scripts/config --enable CONFIG_KCOV
          scripts/config --enable CONFIG_KCOV_ENABLE_COMPARISONS
          scripts/config --set-str CONFIG_LOCALVERSION "-kcov"

          make olddefconfig 2>&1 | tee -a "$HOME/mylog.txt"

      - name: Prepare and build kernel packages
        run: |
          set -e
          cd linux-oem-4.13.0

          make prepare 2>&1 | tee -a "$HOME/mylog.txt"
          make -s kernelrelease 2>&1 | tee -a "$HOME/mylog.txt"
          make -j"$(nproc)" bindeb-pkg 2>&1 | tee -a "$HOME/mylog.txt"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p output

          if [ -f "$HOME/mylog.txt" ]; then
            cp "$HOME/mylog.txt" output/
          fi

          find . -type f -name '*.deb' \
            -not -path './output/*' \
            -exec cp -t output/ {} +

          echo "=== Files collected ==="
          find output -maxdepth 2 -type f -ls

          tar -czvf result.tar.gz -C output .
          ls -lh result.tar.gz

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
          if-no-files-found: error
          retention-days: 7

