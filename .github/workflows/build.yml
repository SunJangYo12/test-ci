name: Compile kernel2029

on:
  push:
    branches: [compile-kernel2019]
  pull_request:
    branches: [compile-kernel2019]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils

      - name: Clone
        run: |
          wget -q https://github.com/torvalds/linux/archive/459e3a21535ae3c7a9a123650e54f5c882b8fcbf.tar.gz -O linux.tar.gz
          mkdir linux
          tar xzf linux.tar.gz -C linux --strip-components=1
          cd linux
          wget -O .config 'https://syzkaller.appspot.com/text?tag=KernelConfig&x=ef1b87b455c397cf'
          cp .config .config.syzbot

      - name: Configure kernel
        run: |
          set -o pipefail
          cd linux
          {
            # hindari error sertifikat/signing
            scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
            scripts/config --set-str MODULE_SIG_KEY ""
            scripts/config --disable DEBUG_INFO_BTF

            make olddefconfig

          } 2>&1 | tee -a ../mylog.txt

      - name: Making kernel
        run: |
          set -o pipefail
          cd linux
          {
            make -j$(nproc) || true

          } 2>&1 | tee -a ../mylog.txt




      - name: Collect artifacts
        run: |
          mkdir -p output

          cp mylog.txt output/

          cp linux/arch/x86/boot/bzImage output || true
          cp linux/vmlinux output || true
          cp linux/System.map output || true
          cp linux/.config output || true
          cp linux/.config.syzbot output || true

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
