name: Fuzzing libjpeg

on:
  push:
    branches: [fuzzing-libjpeg]
  pull_request:
    branches: [fuzzing-libjpeg]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils \
            afl++ clang make curl

      - name: Download vulnerable IJG version
        run: |
          curl -fL \
            https://www.ijg.org/files/jpegsrc.v9c.tar.gz \
            -o jpegsrc.tar.gz

          tar -xzf jpegsrc.tar.gz
          mv jpeg-9c ijg-src

      - name: Build with AFL and ASan
        run: |
           set -o pipefail

           cd ijg-src
           export CC=afl-clang-fast
           export CFLAGS="-O1 -g -fsanitize=address -fno-omit-frame-pointer"
           export LDFLAGS="-fsanitize=address"

           {
             ./configure
             make -j2

             test -x ./djpeg
           } 2>&1 | tee -a ../mylog.txt

      - name: Run AFL++
        run: |

          set -o pipefail
          mkdir -p findings
          {
            echo "starzzzzzzzzzzzzzzzzzzzzz"
            afl-fuzz --version

            AFL_NO_UI=1 afl-fuzz \
              -i ./fuzzing-corpus/jpg \
              -o findings \
              -m none \
              -t 2000+ \
              -V 240 \
              -- ./ijg-src/djpeg @@ || true

          } 2>&1 | tee -a mylog.txt

      - name: Collect artifacts
        run: |
          mkdir -p output

          cp mylog.txt output/
          cp -R findings output

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
