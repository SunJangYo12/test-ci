name: syzkaller build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils

      - name: Clone
        run: |
          git clone https://github.com/google/syzkaller.git

      - name: Configure go
        run: |
          set -o pipefail
          {
            wget https://dl.google.com/go/go1.7.6.linux-amd64.tar.gz
            tar xzf go1.7.6.linux-amd64.tar.gz

          } 2>&1 | tee -a ~/mylog.txt

      - name: Make
        run: |
          set -o pipefail
          #export GOROOT=`pwd`/go
          #export PATH=$GOROOT/bin:$PATH
          #cd syzkaller
          {
            export GOROOT=`pwd`/go
            export GOPATH=`pwd`/syzkaller-lab
            export PATH=$GOROOT/bin:$PATH

            mkdir -p syzkaller-lab/src/github.com/google
            mv syzkaller syzkaller-lab/src/github.com/google
            cd syzkaller-lab/src/github.com/google/syzkaller
            git checkout c5707f5e5

            go build github.com/google/syzkaller/syz-fuzzer || true

            go build github.com/google/syzkaller/syz-manager || true

            gcc -o syz-executor executor/executor.cc \
                -lpthread -lrt -ldl \
                -DGOOS_linux=1 -DGOARCH_amd64=1 \
                -Wall -Wframe-larger-than=8192 \
                -static-libgcc 2>&1 | head -30 || true

          } 2>&1 | tee -a ~/mylog.txt

      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/

          cp -R syzkaller-lab/src/github.com/google/syzkaller/syz-fuzzer output 2>/dev/null || true
          cp -R syzkaller-lab/src/github.com/google/syzkaller/syz-manager output 2>/dev/null || true
          cp -R syzkaller-lab/src/github.com/google/syzkaller/syz-executor output 2>/dev/null || true

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
