name: Listener shell
# host: ./cloudflared access tcp --hostname https://geological-buyers-testing-fifty.trycloudflare.com --url localhost:20023
# host: nc localhost 20023

on:
  push:
    branches: [listen-nc]
  workflow_dispatch:

#gh workflow run build.yml --ref listen-nc


jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:16.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves rsync git fakeroot dpkg-dev \
            python3 perl kmod cpio wget busybox-static netcat-openbsd curl jq \
            apache2 php libapache2-mod-php


      - name: Buka tunnel ke web UI
        env:
          CHAT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "7797309176"

        run: |
          #ubah www-data ke root
          sed -i \
            -e 's/^export APACHE_RUN_USER=.*/export APACHE_RUN_USER=www-data/' \
            -e 's/^export APACHE_RUN_GROUP=.*/export APACHE_RUN_GROUP=www-data/' \
            /etc/apache2/envvars

          chmod 777 -R /var/www/html/
          cd /var/www/html/
          git clone https://github.com/sunjangyo12/ai-web
          service apache2 start

          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          # http
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:80 > wtunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' wtunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="WEB: $URL"
          fi

          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null




          # nc
          nohup ./cloudflared tunnel --no-autoupdate --url tcp://127.0.0.1:20022 > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="NC Listener: $URL"
          else
            MSG="GAGAL listener publik url"
          fi

          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null

          cd ~
          git clone https://github.com/sunjangyo12/test-ci
          cd test-ci
          git checkout listen-nc
          chmod +x ./bot.sh
          nohup ./bot.sh "$CHAT_TOKEN" "$CHAT_ID" > ~/bot.log 2>&1 &





      - name: Run nc listener
        run: |
          # listener nc
          while [ 1 ]; do busybox nc -l -p 20022 -e /bin/sh -i; echo "start nc listen"; done &
          PID_NC=$!


          sleep 18000 # 5jam


      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
