name: xubuntu-vm
on:
  push:
    branches: [ci-boot-xubuntu22]
  workflow_dispatch: # gh workflow run build.yml --ref ci-boot-xubuntu22

# client usage: buka VNC viewer (TigerVNC) > connect ke host:port dari Telegram

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Cek KVM dan pasang paket
        run: |
          ls -l /dev/kvm || echo "KVM TIDAK ADA (akan lambat)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils novnc websockify socat jq wget

          wget https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin

          ngrok version

      - name: Siapkan disk dan ISO
        run: |
          sudo chown $USER /mnt
          cd /mnt
          qemu-img create -f qcow2 xubuntu.qcow2 25G
          wget -q -O xubuntu.iso https://cdimage.ubuntu.com/xubuntu/releases/22.04/release/xubuntu-22.04.5-desktop-amd64.iso

      - name: Jalankan QEMU
        env:
          VNC_PASSWORD: "1234"
        run: |
          cd /mnt
          nohup qemu-system-x86_64 \
            -enable-kvm -cpu host -smp 4 -m 5G \
            -machine q35 \
            -drive file=xubuntu.qcow2,if=virtio \
            -cdrom xubuntu.iso -boot d \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -device virtio-vga,xres=1024,yres=600 -device qemu-xhci -device usb-tablet \
            -monitor unix:/tmp/qemu-mon.sock,server,nowait \
            -vnc 127.0.0.1:0,password=on > qemu.log 2>&1 &
          sleep 5
          echo "set_password vnc $VNC_PASSWORD" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock
          websockify -D --web=/usr/share/novnc 6080 127.0.0.1:5900

      - name: Tunnel ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          CHAT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "7797309176"
        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          nohup ngrok tcp 5900 --log=stdout > tunnel.log 2>&1 &

          # tunggu sampai ngrok siap (maks ~60 detik)
          URL=""
          for i in $(seq 1 30); do
            URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            HOSTPORT="${URL#tcp://}"
            MSG="[VNC] tiggervnc: $HOSTPORT"
          else
            MSG="GAGAL vnc url"
            tail -n 20 tunnel.log
          fi
          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null

          sleep 20000
