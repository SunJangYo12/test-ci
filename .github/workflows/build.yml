name: syzkaller build

on:
  push:
    branches: [compile-ssh]
  pull_request:
    branches: [compile-ssh]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            wget \
            unzip \
            tar \
            perl \
            pkg-config

      - name: Build OpenSSH
        run: |
          set -o pipefail
          {
            chmod +x build-openssh-android.sh
            ./build-openssh-android.sh || true

          } 2>&1 | tee -a ~/mylog.txt

      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/
          cp -R out output || true

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz
