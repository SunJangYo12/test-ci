name: Build Linux Kernel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            wget \
            xz-utils

      - name: Clone Linux kernel
        run: |
          git clone --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git \
            linux

      - name: Configure kernel
        run: |
          cd linux

          make x86_64_defconfig

          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_PACKET
          scripts/config --enable CONFIG_INET

          scripts/config --enable CONFIG_VIRTIO
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_NET

          scripts/config --enable CONFIG_TTY
          scripts/config --enable CONFIG_SERIAL_8250
          scripts/config --enable CONFIG_SERIAL_8250_CONSOLE

          scripts/config --enable CONFIG_KCOV
          scripts/config --enable CONFIG_KCOV_ENABLE_COMPARISONS

          scripts/config --enable CONFIG_DEBUG_KERNEL
          scripts/config --enable CONFIG_DEBUG_INFO
          scripts/config --enable CONFIG_FRAME_POINTER

          make olddefconfig

      - name: Show kernel config
        run: |
          cd linux

          grep -E \
          '^CONFIG_(NET|PACKET|INET|VIRTIO|VIRTIO_PCI|VIRTIO_NET|KCOV|KCOV_ENABLE_COMPARISONS|DEBUG_KERNEL|DEBUG_INFO|FRAME_POINTER|TTY|SERIAL_8250|SERIAL_8250_CONSOLE)=' \
          .config

      - name: Build kernel
        run: |
          cd linux
          make -j$(nproc)

      - name: Package kernel
        run: |
          mkdir -p output

          cp linux/arch/x86/boot/bzImage \
             output/bzImage

          cp linux/vmlinux \
             output/vmlinux

          cp linux/.config \
             output/kernel.config

          tar czvf linux-kernel-x86_64.tar.gz \
             -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-x86_64
          path: linux-kernel-x86_64.tar.gz

