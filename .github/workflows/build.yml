name: Build Program container

on:
  push:
    branches: [compile-cont-php]
  pull_request:
    branches: [compile-cont-php]


permissions:
  contents: write   # wajib untuk membuat release


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build kernel di ubuntu:20.04
        run: |
          mkdir -p out

          curl -L -o php.tar.gz https://github.com/php/php-src/archive/php-7.2.11.tar.gz
          mkdir php7
          tar xzf php.tar.gz -C php7 --strip-components=1

          # patch
          cd php7
          PAT='if (zend_eval_string_ex(exec_direct, NULL, "Command line code", 1) == FAILURE) {'
          grep -qF "$PAT" sapi/cli/php_cli.c || { echo "::error::pola di php_cli.c tidak ditemukan, sesuaikan patch"; exit 1; }

          sed -i "s|${PAT}|__AFL_INIT(); while (__AFL_LOOP(10000)) ${PAT}|" sapi/cli/php_cli.c
          grep -n "__AFL" sapi/cli/php_cli.c
          cd ..

          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -euxc '
            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              curl wget afl++ libxml2-dev autoconf

            # ... langkah build kernel kamu di sini ...
            cd php7

            # configure
            ./buildconf --force
            CC=afl-clang-fast CXX=afl-clang-fast++ ./configure

            # make
            AFL_USE_ASAN=1 make -j4


            # copy result
            cd ..
            cp -R php7 out/
          '

      - name: Kompres
        run: |
          sudo chown -R $USER out
          tar czvf result.tar.gz \
            -C out .

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-7.2.11
          name: php-7.2.11
          files: |
            result.tar.gz




