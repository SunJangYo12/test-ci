name: Build Linux netlink AFL++

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync

      - name: Download Linux 4.15
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.15.tar.gz
          mkdir linux
          tar -xzf linux-4.15.tar.gz --strip-components=1 -C linux

      - name: Configure kernel
        run: |
          cd linux
          ./scripts/config \
              -e EARLY_PRINTK \
              -e 64BIT \
              -e BPF -d EMBEDDED -d EXPERT \
              -e INOTIFY_USER \
              -e ACPI \
              -e BLK_DEV_INITRD \
              -e SYSVIPC \
              -e CC_OPTIMIZE_FOR_PERFORMANCE \
              -d CC_OPTIMIZE_FOR_SIZE \
              -e KCOV \
              -d KCOV_INSTRUMENT_ALL \
              -e KCOV_ENABLE_COMPARISONS



          make olddefconfig

      - name: Build kernel
        run: |
          cd linux
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p output

          cp linux/arch/x86/boot/bzImage output/
          cp linux/vmlinux output/
          cp linux/.config output/kernel.config

          tar czvf linux-4.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-4
          path: linux-4.tar.gz
