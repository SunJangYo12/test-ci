
name: Build Linux 4.6 KCOV

on:
  push:
    branches: [compile-kernel-linux_4.6]
  pull_request:
    branches: [compile-kernel-linux_4.6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc bison flex \
            libssl-dev libelf-dev \
            dwarves cpio kmod \
            git rsync dpkg-dev \
            wget xz-utils

      - name: Download Linux 4.6
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.6.tar.xz
          tar -xf linux-4.6.tar.xz

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd linux-4.6

          cp ../linux-config/.config .config

          scripts/config --enable KCOV
          scripts/config --set-str LOCALVERSION "-kcov"

          make olddefconfig

          echo "=== Compiler ==="
          gcc --version

          echo "=== Kernel release ==="
          make -s kernelrelease

          echo "=== KCOV config ==="
          grep -E '^CONFIG_(KCOV|KCOV_ENABLE_COMPARISONS|DEBUG_FS)=' \
            .config || true

          grep -q '^CONFIG_KCOV=y$' .config || {
            echo "ERROR: CONFIG_KCOV is not enabled"
            exit 1
          }

      - name: Prepare and build packages
        run: |
          set -euo pipefail
          cd linux-4.6

          make prepare
          make -j"$(nproc)" bindeb-pkg

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p output
          cp linux-4.6/*.deb output/ 2>/dev/null || true
          tar czf linux-4.6-kcov.tar.gz -C output .

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-4.6-kcov
          path: linux-4.6-kcov.tar.gz
          if-no-files-found: warn
